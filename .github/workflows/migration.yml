name: migrate deploy

# Flyway runs as a container here, not inside the application. The account server
# has no Flyway dependency and never applies its own schema.
on:
  push:
    branches:
      - deploy

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # baselineOnMigrate/baselineVersion=1 mark V001 as already applied on the
      # existing database, so the baseline dump never runs against live data.
      - name: Migrate with flyway
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/migration:/flyway/sql \
            redgate/flyway:latest \
            -url=${{ secrets.ACCOUNT_DB_URL }} \
            -user=${{ secrets.ACCOUNT_DB_USER }} \
            -password=${{ secrets.ACCOUNT_DB_PASSWORD }} \
            -baselineOnMigrate=true \
            -baselineVersion=1 \
            -mixed=true \
            migrate

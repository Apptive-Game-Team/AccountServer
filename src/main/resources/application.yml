server:
  port: ${PORT}
  protocol: ${PROTOCOL}
  domain: ${DOMAIN}
  external-port: ${EXTERNAL_PORT}
  internal-base-url: ${INTERNAL_BASE_URL:}

# Metrics run on their own port so the public app port never serves /actuator.
# Health and Prometheus endpoints allow unauthenticated scrapes.
# MANAGEMENT_PORT must stay reachable only from the Prometheus host.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: account-server
  config:
    import: optional:file:.env[.properties]
  r2dbc:
    account:
      url: ${ACCOUNT_DATABASE_URL}
      username: ${ACCOUNT_DATABASE_USERNAME}
      password: ${ACCOUNT_DATABASE_PASSWORD}
    game:
      url: ${GAME_DATABASE_URL}
      username: ${GAME_DATABASE_USERNAME}
      password: ${GAME_DATABASE_PASSWORD}
  sql:
    init:
      mode: never

jwt:
  access-private-key: ${JWT_PRIVATE_KEY}
  access-public-key: ${JWT_PUBLIC_KEY}

# Origins allowed to send credentialed cross-site requests. Credentials are on, so this list
# can never contain "*": the server would then reflect any caller's Origin back and hand a
# logged-in member's refresh cookie to whichever site asked.
# Entries are Spring origin patterns, which is what lets the localhost entry cover any dev port.
# html-classic.itch.zone is where itch.io serves the WebGL build from, and the same host serves
# every other HTML game on itch.io, so any of them may call this server. They get nothing a
# stranger could not already ask for: the refresh cookie is SameSite=Lax and is never attached
# from there, and without it every endpoint on this list still needs a token. The game server
# allows the same host, in CorsConfig.
cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:https://arcanecasters.theevilent.com,https://account.theevilent.com,https://html-classic.itch.zone,http://localhost:[*]}"

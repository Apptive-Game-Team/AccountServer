<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<section>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <img class="ent-auth-logo" th:src="@{/images/theevilent-logo.png}" alt="The Evil Ent">
                <div class="card">
                    <div class="card-header">
                        <h1 class="ent-auth-title">Login</h1>
                    </div>
                    <div class="card-body">
                        <div th:if="${loginError}" class="alert alert-danger" role="alert">Could not sign in. Check your credentials or try again.</div>
                        <form th:action="@{/login}" method="post"
                              th:attr="data-session-refresh=${restoreSession} ? @{/login/session/refresh} : null, data-session-home=@{/admin}">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password:</label>
                                <input type="password" class="form-control" id="password" name="password" minlength="8" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Login</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
